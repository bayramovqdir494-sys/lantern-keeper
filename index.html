// tiles: 0 empty,1 solid,2 one-way,3 spikes,4 gate,5 light-bridge,6 bramble
class LB{constructor(ch){this.ch=ch;this.cols=600;this.g=new Uint8Array(this.cols*ROWS);this.x=0;this.h=4;this.o=[];this.deco=[];this.gid=0;this.stones=0;srand(900+ch*31)}
 set(c,r,v){if(c>=0&&c<this.cols&&r>=0&&r<ROWS)this.g[r*this.cols+c]=v}
 get(c,r){return c<0||c>=this.cols||r<0||r>=ROWS?0:this.g[r*this.cols+c]}
 sy(h=this.h){return(ROWS-h)*T}                     // surface y in px
 cxp(c){return c*T+T/2}
 col(c,h){for(let r=ROWS-h;r<ROWS;r++)this.set(c,r,1)}
 add(type,c,y,p={}){const o=Object.assign({type,x:this.cxp(c),y},p);this.o.push(o);return o}
 flat(n,deco=1){if(deco&&n>=4&&rnd()<.45){const k=Math.min(4,n-1);for(let i=0;i<k;i++)this.add('ember',this.x+1+i,this.sy()-T*1.1)}for(let i=0;i<n;i++){this.col(this.x,this.h);if(deco&&rnd()<.55)this.deco.push({c:this.x,r:ROWS-this.h,k:rnd(),dx:rnd()*40-20});this.x++}return this}
 up(k=1){this.h+=k;return this}down(k=1){this.h-=k;return this}
 gap(n){const y=this.sy();for(let i=0;i<=n;i++){const a=i/n;this.add('ember',this.x+i,y-T*1.3-Math.sin(a*Math.PI)*T*1.3).x-=T/2}this.x+=n;return this}
 spikes(n){for(let i=0;i<n;i++){this.col(this.x,this.h);this.set(this.x,ROWS-this.h-1,3);this.x++}return this}
 plat(dc,ra,w,c0=this.x){for(let i=0;i<w;i++)this.set(c0+dc+i,ROWS-this.h-ra,2);return this}
 block(dc,ra,w,hh=1){for(let i=0;i<w;i++)for(let k=0;k<hh;k++)this.set(this.x+dc+i,ROWS-this.h-ra+k,1);return this}
 ember(dc,n,ra=1.2,arc=0){for(let i=0;i<n;i++){const a=n>1?i/(n-1):.5;this.add('ember',this.x+dc,this.sy()-ra*T-Math.sin(a*Math.PI)*arc*T,{dx:(i-(n-1)/2)*44})}
  this.o.slice(-n).forEach(o=>o.x+=o.dx);return this}
 emberAt(c,y,n,arc=0){for(let i=0;i<n;i++){const a=n>1?i/(n-1):.5;this.add('ember',c,y-Math.sin(a*Math.PI)*arc*T).x+=(i-(n-1)/2)*44}return this}
 stone(dc,ra){this.add('stone',this.x+dc,this.sy()-ra*T+T*.5,{id:this.stones++});return this}
 heart(dc,ra=1){this.add('heart',this.x+dc,this.sy()-ra*T);return this}
 enemy(type,dc,p={}){const c=this.x+dc;let y=this.sy();if(type==='bat')y-=T*(p.alt||2.6);this.add('enemy',c,y,Object.assign({et:type,range:p.range||3},p));return this}
 check(){this.add('check',this.x,this.sy());return this}
 npc(id,key,dc=0){this.add('npc',this.x+dc,this.sy(),{id,key});return this}
 spring(dc=0){this.add('spring',this.x+dc,this.sy());return this}
 sign(dc,txt){this.add('sign',this.x+dc,this.sy(),{txt});return this}
 // light puzzle: timed braziers open a sun gate
 brazierGate(n=2){const id=this.gid++;this.flat(2);for(let i=0;i<n;i++){if(i%2===1){this.up(1).flat(1);this.add('brazier',this.x,this.sy(),{gid:id});this.flat(3).down(1)}else{this.add('brazier',this.x,this.sy(),{gid:id});this.flat(3)}}
  this.flat(1);const gc=this.x;for(let k=1;k<=4;k++)this.set(gc,ROWS-this.h-k,4);this.add('gate',gc,this.sy(),{gid:id,need:n});this.flat(1);this.flat(2);return this}
 // strike the sun crystal -> temporary light bridge over a wide gap

   if(s.homing){const dd=Math.hypot(sdx,s.y-(p.y-44));if(dd<150){p.f=Math.sign(sdx)||p.f;wantAtk=1;BOT.faceLock=Math.sign(sdx)}continue}
   let lx,tt;if(s.g){const vy=s.vy,ay=GRAV*.5,h=py-s.y;tt=(-vy+Math.sqrt(Math.max(0,vy*vy+4*ay*h)))/(2*ay);lx=s.x+s.vx*tt}else if(s.vy>40){tt=(py-s.y)/s.vy;lx=s.x+s.vx*tt}else{if(Math.abs(sdx)<220&&Math.sign(-sdx)===Math.sign(s.vx)&&Math.abs(s.y-py)<80)danger=1;continue}
   if(tt>0&&tt<1.6)lands.push([lx,tt])}
  if(lands.some(l=>Math.abs(l[0]-p.x)<60)){let best=0,bs=-1;for(const d of[-1,0,1]){let m=1e9;for(const[lx,tt]of lands){const fx=clamp(p.x+d*RUNV*Math.min(tt,.9),G.arena.x0+60,G.arena.x1-60);m=Math.min(m,Math.abs(fx-lx))}if(m>bs){bs=m;best=d}}flee=best||0;BOT.dodge=best===0?1:0}
  if((b.st==='charge'||b.st==='swoop')&&Math.sign(b.f)===-Math.sign(dx)){const sp=b.st==='swoop'?(b.phase>1?820:700):(b.phase>1?820:700);if(adx<105+.27*sp)danger=1}
  if(b.st==='leap'||b.st==='drop'){if(adx<200)flee=-Math.sign(dx)||1}
  if(b.marks)for(const m of b.marks)if(!m.hit&&Math.abs(m.x-p.x)<80)flee=Math.sign(p.x-m.x)||1;
  if(b.st==='slam'&&adx<230)flee=-Math.sign(dx)||1;
  const open=b.safe&&b.safe.includes(b.st)&&b.vuln&&!(b.kind==='roc'&&b.st==='hover')&&!(b.name==='Storm Roc'&&b.st==='hover');
  if(flee||BOT.dodge){dir=flee;BOT.dodge=0;if((dir<0&&p.x<G.arena.x0+90)||(dir>0&&p.x>G.arena.x1-90))dir=-dir}
  else if(open){dir=adx>b.w/2+20?Math.sign(dx):0;if(adx<b.w/2+90){p.f=Math.sign(dx)||1;wantAtk=1}}
  else{const want=300;dir=adx<want-40?-Math.sign(dx):adx>want+120?Math.sign(dx):0;if((dir<0&&p.x<G.arena.x0+90)||(dir>0&&p.x>G.arena.x1-90))dir=0}
  if(hasAbility('burst')&&p.en>0&&open&&adx<650&&adx>90){p.f=Math.sign(dx)||1;wantBurst=1}
  if(BOT.faceLock){dir=0;p.f=BOT.faceLock;BOT.faceLock=0}
  if(danger)wantJump=1;BOT.bossDanger=danger}
 // great lantern
 if(G.boss&&G.boss.dead){const gl=G.obj.find(o=>o.type==='great');if(gl)dir=Math.sign(gl.x-p.x)||1}
 // enemies
 for(const e of G.en){if(e.dead)continue;const dx=e.x-p.x;if(Math.sign(dx)===p.f||Math.abs(dx)<40){if(Math.abs(dx)<130&&e.y>p.y-200&&e.y-e.h<p.y+20){wantAtk=1;p.f=Math.sign(dx)||p.f;if(e.y<p.y-60)wantJump=1;else if(Math.abs(dx)<95&&e.type!=='bat'&&!G.arena)dir=e.hurtT>0?0:-Math.sign(dx)*0}else if(hasAbility('burst')&&p.en>1&&Math.abs(dx)<500&&Math.abs(e.y-e.h/2-(p.y-46))<50)wantBurst=1}}
 // brambles
 const bc=Math.floor((p.x+p.f*40)/T);for(let k=0;k<5;k++){const c=Math.floor(p.x/T)+k;let br=false;for(let r=Math.floor((p.y-80)/T);r<=Math.floor((p.y-4)/T);r++)if(tileAt(c,r)===6)br=true;if(br){if(k<=3){if(p.en>0){p.f=1;wantBurst=1}dir=k<=1?0:dir}break}}
 // terrain
 if(dir!==0&&!target||target&&dir!==0){const ax=p.x+dir*(p.w/2+18),gAhead=p.ground?groundAtX(ax,fy):1;
  if(p.ground){if(gAhead==null||gAhead>fy+3*T){// gap ahead
    const mv=G.obj.find(o=>o.type==='mover'&&o.mx<p.x+6*T&&o.mx+o.w>p.x-T&&Math.abs(o.my-fy)<8);
    if(mv&&p.onM!==mv){const edge=dir>0?mv.mx:mv.mx+mv.w;if(Math.abs(edge-ax)<34||(ax>mv.mx+10&&ax<mv.mx+mv.w-10))BOT.walk=1;else{dir=0;BOT.walk=0}}
    else if(!mv)wantJump=1}
   const c2=Math.floor((p.x+dir*(p.w/2+10))/T);if(solidV(tileAt(c2,Math.floor((fy-10)/T)))||solidV(tileAt(c2,Math.floor((fy-70)/T))))wantJump=1;
   for(let k=1;k<=2;k++)if(tileAt(Math.floor(p.x/T)+dir*k,Math.floor((fy-4)/T))===3)wantJump=1}
  if(p.onM&&p.onM.type==='mover'){const m=p.onM;const far=dir>0?m.mx+m.w:m.mx;const gx=groundAtX(far+dir*20,fy);if(gx===null||Math.abs(gx-fy)>8){if(!(Math.abs(p.x-(far-dir*30))<40))dir=dir;else dir=0}}
  if(!p.ground){const g2=groundAtX(p.x+dir*60,fy-8);if(p.vy>0&&(g2==null||g2>fy+2*T))wantJump=hasAbility('double')&&!p.dj?1:0;const c2=Math.floor((p.x+dir*(p.w/2+10))/T);if(solidV(tileAt(c2,Math.floor((fy-10)/T)))&&p.vy>-100&&!p.dj&&hasAbility('double'))wantJump=1}}
 // stuck detection
 if(Math.abs(p.x-BOT.lastX)<2&&dir!==0&&!G.arena)BOT.stuck+=STEP;else BOT.stuck=0;BOT.lastX=p.x;if(BOT.stuck>1.5){wantJump=1;if(BOT.stuck>4){dir=-dir;}if(BOT.stuck>6)BOT.stuck=0}
 if(dir>0)i.r=1;else if(dir<0)i.l=1;
 if(wantJump){if(p.ground||(!p.ground&&p.vy>-200))i.jumpP=1;BOT.hold=.3}
 if(BOT.bossDanger&&!p.ground&&p.vy>-150&&hasAbility('double')&&!p.dj)i.jumpP=1;BOT.bossDanger=0;
 if(BOT.hold>0){i.jump=1;BOT.hold-=STEP}
 if(wantAtk)i.atkP=1;if(wantBurst)i.burstP=1}
inp.bot=i=>botThink(i);
